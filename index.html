<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Morning Stock TOP20</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f7fb;color:#111827}header{background:#111827;color:white;padding:22px 16px}h1{margin:0 0 6px;font-size:24px}.sub,.meta,.note{font-size:13px;color:#6b7280}.sub{color:#cbd5e1}main{max-width:900px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#3730a3;font-size:12px;margin:6px 4px 0 0}.stock{border-top:1px solid #eee;padding:15px 0}.rank{font-weight:800;font-size:18px;display:inline-block;width:32px}.code{font-weight:700}.name{font-weight:600}.price{float:right;font-weight:700}.score{font-size:12px;color:#4b5563;margin-top:5px}.reason{margin-top:7px;line-height:1.55}</style></head><body><header><h1>📈 Morning Stock TOP20</h1><div class="sub">東証プライム・朝のスクリーニング（無料版）</div></header><main><div class="card" id="summary">読み込み中…</div><div class="card"><h2>おすすめ TOP20</h2><div id="list">データを読み込んでいます…</div></div><div class="card note"><b>判定について</b><br>前日の日本株の値動き・出来高・短期モメンタムに加え、米国主要指数と半導体地合いを参考に点数化しています。投資判断を保証するものではありません。</div></main><script>async function load(){try{const r=await fetch("data.json?"+Date.now());if(!r.ok)throw 0;const d=await r.json();document.getElementById("summary").innerHTML="<b>"+d.asof_jst+"</b><br><span class='meta'>"+d.market_summary+"</span><br><span class='badge'>米国 "+d.us_signal+"</span><span class='badge'>日本 "+d.jp_signal+"</span><span class='badge'>半導体 "+d.semi_signal+"</span>";document.getElementById("list").innerHTML=d.stocks.map((s,i)=>"<div class='stock'><span class='rank'>"+(i+1)+"</span><span class='code'>"+s.code+"</span> <span class='name'>"+s.name+"</span><span class='price'>"+s.price+"</span><div class='score'>総合スコア "+s.score+" / 100　｜"+s.signal+"</div><div class='reason'>"+s.reason+"</div></div>").join("")}catch(e){document.getElementById("summary").innerHTML="<b>初回データ更新待ち</b><br><span class='meta'>GitHub Actionsの初回実行後にTOP20が表示されます。</span>";document.getElementById("list").innerHTML=""}}load()</script></body></html>
